services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./product-api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DB_URL: postgresql+psycopg://app:devpw@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

