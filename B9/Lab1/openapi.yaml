openapi: 3.0.3
info:
  title: Users API
  version: 2.0.0
servers:
  - url: http://localhost:5000
paths:
  /api/v1/users/{uid}:
    get:
      summary: Get user (v1, deprecated)
      deprecated: true
      parameters:
        - name: uid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          headers:
            Sunset:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserV1' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v2/users:
    post:
      summary: Create user (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserV2Input' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserV2' }
        '400':
          description: Missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v2/users/{uid}:
    get:
      summary: Get user (v2)
      parameters:
        - name: uid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserV2' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    UserV1:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: string }
    UserV2Input:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
    UserV2:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
